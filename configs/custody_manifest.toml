# Modules that can lose an account (its auth key, its session file, its 2FA password, its
# ownership of authorizations) or that guard against that. A PR that changes any of them needs
# the repository owner's `custody-reviewed` label (tools/custody_gate.py, .github/workflows/
# custody.yml). Agents never add the label.
#
# Paths are repo-relative. `**` crosses directories, `*` and `?` stay inside one segment.
# Add a module when it constructs a Telethon client, touches a `.session` file, makes or ends
# an authorization, reads or writes the 2FA password, deletes an account, copies or restores
# the database or session files, runs a migration, or decides `status` / `link_status`.
# The executable rules that pin this surface are tests/test_custody_invariants.py.

label = "custody-reviewed"

paths = [
    # The gate itself: its manifest, its tool, its workflow, the rules, the file-mode helper.
    "configs/custody_manifest.toml",
    "tools/custody_gate.py",
    ".github/workflows/custody.yml",
    "tests/test_custody_invariants.py",
    "tests/_custody_scan.py",
    "tests/_custody_scan_*.py",
    "core/secure_paths.py",
    "core/_windows_acl.py",
    "core/private_paths.py",
    "core/twofa_budget.py",
    "core/migration_steps_twofa_attempts.py",
    "services/session_guard/_private_paths.py",
    "tools/secure_paths.py",

    # The one place a Telethon client is built, and the client that refuses what ends sessions.
    "core/telegram_client/_client.py",
    "core/telegram_client/_guarded_client.py",
    "core/telegram_client/_pool*.py",
    "core/telegram_client/_api_credentials.py",

