version: 2
updates:
  # Keep GitHub Actions pinned versions current. Catches the Node-20 → Node-24
  # deprecation that CI annotations have been warning about, and similar.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Supply-chain cooldown: let new releases age 7 days before Dependabot
    # proposes them, so compromised/broken versions get caught upstream first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  # Auto-update Telethon (our core Telegram SDK). The "pip" ecosystem is uv-aware
  # and reads uv.lock; scoped to telethon only via `allow` so we don't get PR
  # spam for the whole Python tree, and don't fight the manual CVE pins in
  # pyproject's [tool.uv] override-dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "telethon"

  # There is deliberately NO npm entry for frontend/. Every entry in this file
  # configures *version* updates, and the SPA does not want them: the toolchain is
  # majors-heavy, so one eslint bump drags in five plugin majors and a ruleset that
  # flags pre-existing code (PR #286). Adding an entry with
  # `open-pull-requests-limit: 0` to express that would be pure decoration.
  #
  # npm SECURITY updates do not depend on this file at all -- GitHub's docs are
  # explicit that dependabot.yml settings and Dependabot alerts do not interact.
  # They depend on "Dependabot alerts" + "Dependabot security updates" being ON in
  # repository settings, and both are currently OFF, so the `npm audit` job in
  # ci.yml plus its nightly copy are the only npm CVE detection this repo has.
  #
  # NOTE the same applies to the pip entry above: its `allow: telethon` restricts
  # security updates too, not just version updates. Do not copy that pattern here.
