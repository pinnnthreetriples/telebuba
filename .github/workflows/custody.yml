name: Custody gate

# A PR that touches account-custody code (configs/custody_manifest.toml) or moves the Telethon
# version needs the owner's `custody-reviewed` label. The job re-runs on label changes so adding
# or removing the label updates the check. Like ci.yml it carries no `paths` filter, so it
# always reports.
#
# Why `pull_request_target`: the workflow file and tools/custody_gate.py both run from the BASE
# branch, so a PR cannot edit the gate (or the workflow) to exempt itself. PR content is only
# fetched and diffed as data (refs/remotes/pr/head); it is never checked out into the workspace
# and never executed. Consequence: the gate starts working for PRs opened AFTER this file is on
# `main`; a PR opened before that is not judged by it.
#
# The label approves one specific head: a new push (`synchronize`) removes it again.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHON_VERSION: "3.13.14"
  UV_VERSION: "0.11.29"

jobs:
  custody:
    name: custody gate (label custody-reviewed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Default ref for pull_request_target: the base branch. Never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      # Event data travels only through the environment, never into the script text.
      - name: Fetch the PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"

      # A new push invalidates the review: withdraw the label (the event payload still lists it).
      - name: Withdraw the approval on a new push
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label custody-reviewed || true

      - name: Check custody label (after a push)
        if: github.event.action == 'synchronize'
        env:
          PR_LABELS: "[]"
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project python tools/custody_gate.py --base "origin/$BASE_REF" --head refs/remotes/pr/head

      - name: Check custody label
        if: github.event.action != 'synchronize'
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_REF: ${{ github.base_ref }}
        run: uv run --no-project python tools/custody_gate.py --base "origin/$BASE_REF" --head refs/remotes/pr/head
