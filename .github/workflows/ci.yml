name: CI

# No `paths-ignore`. It used to skip .mex/**, Markdown, .gitignore and LICENSE to
# save runner minutes, but these jobs are now REQUIRED status checks on main, and a
# workflow that does not run reports nothing: a docs-only PR would sit forever on
# "Expected — waiting for status to be reported", unmergeable. Since the whole point
# of requiring them is that nothing reaches main ungated, paying ~2 parallel minutes
# on a README typo is the right side of that trade. Do not reintroduce the filter
# without also adding same-named no-op jobs for the skipped paths.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain hardening: drop default write scopes; every job opts in to what
# it actually needs. None of the jobs below post comments or push code, so
# read-all is sufficient.
permissions: read-all

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.10.9"
  AISLOP_NPM_PACKAGE: "aislop@0.10.2"
  # Node 24: steiger's web-tree-sitter (WASM) throws "bad export type for 'deleter'"
  # on Node 20. 24 is the dev target and runs the whole FE toolchain cleanly.
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format + types + secrets + bandit, all via the same pre-commit
  # config developers run locally. One source of truth, no drift.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint, format, types, secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs history to scan the full diff on push
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Cache pre-commit envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pre-commit (all hooks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------------------
  # Tests under the strict config from pyproject.toml.
  # Hypothesis profile depends on the trigger:
  #   PR / workflow_dispatch → dev (50 examples, fast feedback)
  #   push to main           → strict (200 examples)
  # The nightly workflow runs the extended profile separately.
  # ---------------------------------------------------------------------------
  test:
    name: pytest (strict)
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'pull_request' && 'dev' || 'strict' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        # --maxfail caps log noise when a single bad import cascades into
        # many warning-as-error failures. Diagnostic info is preserved.
        run: uv run pytest --maxfail=10

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Dependency CVE scan. Runs on every PR and push.
  # ---------------------------------------------------------------------------
  audit:
    name: pip-audit (CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pip-audit
        # PYSEC-2026-2132 (click < 8.3.3) is unfixable here: semgrep pins
        # ``click~=8.1.8`` (< 8.2), so click cannot be bumped while semgrep is a
        # dev dependency. click is dev-tooling / uvicorn-CLI only, not a runtime
        # request path. Drop this ignore once semgrep loosens its click pin.
        run: uv run pip-audit --strict --ignore-vuln PYSEC-2026-2132

  # ---------------------------------------------------------------------------
  # The npm half of the same gate. Its absence is why eighteen vulnerable packages
  # (16 distinct advisories) accumulated unnoticed while pip-audit kept the Python
  # tree clean -- one of them, a prototype pollution in @tanstack/form-core, in the
  # shipped bundle, and three rated critical in tooling that runs in this workflow.
  #
  # Its own job rather than a step in `frontend`: an upstream disclosure turns this
  # red without a single line of our code changing, and that must not read as "the
  # SPA is broken". Same shape as pip-audit above, same reviewed-ignore convention
  # if a finding ever turns out to be unfixable.
  #
  # Both audit jobs also run nightly. On PR/push alone, a CVE disclosed during a
  # quiet week stays invisible until the next unrelated change -- which is the
  # failure mode that produced the backlog in the first place.
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit (CVE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --audit-level=info, spelled out: omitting the flag is NOT "no floor". npm
      # leaves the config null and npm-audit-report falls back to ``low``, so an
      # info-severity advisory prints in the log and the job exits 0. The backlog
      # this gate exists for included a browser-facing prototype-pollution hole
      # rated merely "moderate", so guessing a floor is exactly the wrong instinct.
      #
      # No --omit=dev either: devDependencies are where the backlog lived, and one
      # of them (@hey-api/openapi-ts) emits code INTO the shipped client.
      #
      # --package-lock-only, and deliberately no ``npm ci``: lockfileVersion 3
      # records the fully resolved tree including what ``overrides`` resolved to, so
      # the install buys no extra coverage -- it only adds a way for this job to go
      # red over registry flake or lockfile drift under a label that says "CVE".
      # Drift is the `frontend` job's business; it runs npm ci already.
      - name: Run npm audit
        run: npm audit --package-lock-only --audit-level=info

  # ---------------------------------------------------------------------------
  # SAST scan on every PR and push, so the security gate fires before merge
  # (not after). The heavier full rulesets run in the nightly workflow.
  # ---------------------------------------------------------------------------
  semgrep:
    name: semgrep (SAST, auto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run semgrep
        # No --exclude-rule list: the CI-hardening advisories it used to mute
        # (dependabot/uv cooldowns + mutable action tags) are fixed at the source —
        # actions pinned to SHAs, cooldowns configured in dependabot.yml/pyproject.
        run: uv run semgrep --config auto --error .

  # ---------------------------------------------------------------------------
  # aislop — AI-slop quality gate, zero-tolerance (any error OR warning fails).
  # It is an npm tool, so the runner needs Node; the gate is a thin JSON-parsing
  # wrapper (tools/aislop_gate.py). Runs on every PR and push.
  # ---------------------------------------------------------------------------
  aislop:
    name: aislop (quality gate, zero-tolerance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run aislop gate
        run: uv run python tools/aislop_gate.py

  # ---------------------------------------------------------------------------
  # gen-api drift — regenerate the typed frontend client from the live OpenAPI
  # schema and fail if it differs from what is committed. This is the hard
  # anti-drift gate: pydantic -> FastAPI OpenAPI -> hey-api client must stay
  # in sync. Pinned generator versions (frontend/package-lock.json + npm ci)
  # make the output reproducible across machines.
  # ---------------------------------------------------------------------------
  gen-api:
    name: gen-api (client drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Regenerate the API client
        run: uv run python -m tools.gen_api

      - name: Fail on client drift
        run: git diff --exit-code frontend/src/shared/api frontend/openapi.json

  # ---------------------------------------------------------------------------
  # frontend — the React SPA's own gate set (per the FSD ADR): Steiger boundary
  # lint + ESLint + Prettier + tsc --strict + Vitest (80% floor), then a
  # production build. Independent of the Python jobs.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (lint/boundaries/tsc/vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Gates (boundaries + eslint + prettier + tsc + vitest)
        run: npm run gates

      - name: Build
        run: npm run build
