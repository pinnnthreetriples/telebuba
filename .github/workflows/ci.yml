name: CI

# No `paths-ignore`. It used to skip .mex/**, Markdown, .gitignore and LICENSE to
# save runner minutes, but these jobs are now REQUIRED status checks on main, and a
# workflow that does not run reports nothing: a docs-only PR would sit forever on
# "Expected — waiting for status to be reported", unmergeable. Since the whole point
# of requiring them is that nothing reaches main ungated, paying ~2 parallel minutes
# on a README typo is the right side of that trade. Do not reintroduce the filter
# without also adding same-named no-op jobs for the skipped paths.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Supply-chain hardening: drop default write scopes; every job opts in to what
# it actually needs. None of the jobs below post comments or push code, so
# read-all is sufficient.
permissions: read-all

env:
  PYTHON_VERSION: "3.13.14"
  UV_VERSION: "0.11.29"
  AISLOP_NPM_PACKAGE: "aislop@0.14.0"
  # Node 24: steiger's web-tree-sitter (WASM) throws "bad export type for 'deleter'"
  # on Node 20. 24 is the dev target and runs the whole FE toolchain cleanly.
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format + types + secrets + bandit, all via the same pre-commit
  # config developers run locally. One source of truth, no drift.
  # ---------------------------------------------------------------------------
  # Every job below carries an explicit `timeout-minutes`. Without one GitHub
  # applies its six-hour default, so a hung step burns six hours of runner time
  # and blocks the PR until a human notices — which is not hypothetical: a
  # `pytest (strict)` run sat stuck for 62 minutes on an unmodified suite and had
  # to be cancelled by hand. The ceilings are fitted per job to the observed
  # duration of recent successful runs, not pasted from one number: each is a
  # tripwire for "this is hung", never a budget the job is expected to approach.
  lint:
    name: Lint, format, types, secrets
    runs-on: ubuntu-latest
    # Observed 23-44s. The wide margin is for a COLD cache: these runs all reused
    # the pre-commit env cache, and rebuilding every hook env from scratch (which
    # any .pre-commit-config.yaml change forces) is minutes, not seconds. The
    # gitleaks step also pulls a Docker image and scans full history.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for the gitleaks step below: `detect` scans every commit,
          # not a diff. The pre-commit gitleaks hook does NOT use it (see below).
          fetch-depth: 0

      # The pre-commit gitleaks hook cannot do this in CI: upstream pins
      # `gitleaks protect --staged` with pass_filenames: false, and after
      # actions/checkout the index is empty — it reports "0 commits scanned" and
      # always passes. So secrets are gated here instead, with `detect` over the
      # full history fetched above, pinned to the same version as the hook rev.
      #
      # --verbose is what makes a red gate actionable: without it the entire output
      # of a firing scan is "leaks found: N" — no rule, file, line or commit. With
      # it each finding prints RuleID/File/Line/Commit while --redact replaces the
      # matched value with "REDACTED", so the location is public-log safe and the
      # secret is not. The safe.directory env is required because the container
      # user does not own the mounted repo.
      #
      # --exit-code 1 governs "leaks found", NOT "the scan failed". A git-level
      # breakage inside the container (safe.directory env drift, an unreadable or
      # partial .git) makes gitleaks print `ERR failed to scan Git repository` and
      # still exit 0 — the identical green no-op as the `protect --staged` bug
      # above. So the run must also prove it scanned a non-zero number of commits
      # (the "0 commits scanned" the hook prints must not satisfy it, hence
      # `[1-9][0-9]*`). The match is anchored to gitleaks' own `INF ... commits
      # scanned.` line so verbatim git stderr in the same log cannot satisfy it —
      # `.*` and not `[^0-9]*`, because the image colours its output even into a
      # pipe and the ANSI reset between `INF` and the count is literally `\e[0m`.
      # `shell: bash` is required, not cosmetic: the default `bash -e {0}` has no
      # pipefail, so the pipe to tee would swallow docker's exit code and a real
      # leak would pass. The log goes to RUNNER_TEMP so it cannot be left behind in
      # the workspace.
      #
      # The tripwire is not paranoia: `detect` auto-loads `.gitleaks.toml` from the
      # scanned directory — the bind-mounted repo — and a repo-local config REPLACES
      # the default ruleset instead of extending it. `.gitleaksignore` works by a
      # different mechanism — it suppresses findings by fingerprint and leaves the
      # ruleset alone — but reaches the same place: either file can leave this step
      # scanning every commit, printing the count checked for, reporting nothing, and
      # going green with secrets in history. The repo has neither. What the tripwire
      # covers is exactly that, disabling via a config file; an inline
      # `#gitleaks:allow` comment needs no file at all and is invisible here. That
      # residual is caught the same way editing this workflow is — by reading the diff.
      #
      # The image is v8.21.2 (same as the hook rev) pinned BY DIGEST, not by tag:
      # this step bind-mounts the whole repo including full git history into it, and
      # a tag can be re-pushed to different bytes. Every `uses:` here is SHA-pinned
      # for that reason and the semgrep job below dropped its mutable-tag advisory
      # mute; a mutable `:v8.21.2` here would put the class straight back.
      - name: Scan git history for secrets (gitleaks detect)
        shell: bash
        run: |
          [ ! -e .gitleaks.toml ] && [ ! -e .gitleaksignore ] \
            || { echo "::error::repo-local gitleaks config would defeat this scan"; exit 1; }
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 \
            detect --redact --verbose --no-banner --exit-code 1 \
            2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          grep -qE 'INF.*[1-9][0-9]* commits scanned\.' "$RUNNER_TEMP/gitleaks.log" \
            || { echo "::error::gitleaks exited 0 without scanning any commits"; exit 1; }

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Cache pre-commit envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pre-commit (all hooks)
        # SKIP=gitleaks: in CI the hook is the zero-commit `protect --staged` no-op
        # described above, and it prints "Detect hardcoded secrets....Passed" while
        # having checked nothing. Skipping it leaves the step above as the only
        # secret signal in this job. The hook stays in .pre-commit-config.yaml —
        # `protect --staged` is the right thing for a local staged diff.
        env:
          SKIP: gitleaks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------------------
  # Tests under the strict config from pyproject.toml.
  # Hypothesis profile depends on the trigger:
  #   PR / workflow_dispatch → dev (50 examples, fast feedback)
  #   push to main           → strict (200 examples)
  # The nightly workflow runs the extended profile separately.
  # ---------------------------------------------------------------------------
  test:
    name: pytest (strict)
    runs-on: ubuntu-latest
    # The job this exists for: it hung for 62 minutes on an unmodified suite and
    # was cancelled by hand. Observed 231-317s serially, and `-n auto` below is
    # measured at roughly a quarter of the serial wall clock, so a healthy run
    # should land near two minutes. Ten minutes is ~5x that and still ~2x the
    # slowest serial run ever recorded here, so it cannot go red on a slow runner
    # while a genuine hang now surfaces in ten minutes instead of six hours.
    timeout-minutes: 10
    env:
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'pull_request' && 'dev' || 'strict' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pytest
        # --maxfail caps log noise when a single bad import cascades into
        # many warning-as-error failures. Diagnostic info is preserved.
        #
        # -n auto (pytest-xdist) is the only speed knob here: every quality gate
        # in pyproject.toml's addopts — branch coverage, the 90% floor,
        # filterwarnings=error, --strict-markers, xfail_strict — still applies,
        # because addopts is untouched and xdist merges the workers' coverage.
        # It lives in the CI invocation, not addopts, so a developer running
        # plain `pytest` still gets the serial, readable, single-stream run.
        #
        # `auto` rather than a pinned worker count: xdist's auto is the runner's
        # CPU count, so it tracks whatever size GitHub gives this job instead of
        # oversubscribing a small runner or leaving a large one idle. Test-level
        # isolation is what makes this safe (tests/conftest.py gives every test
        # its own session dir); nothing here depends on the worker count.
        run: uv run pytest --maxfail=10 -n auto

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Dependency CVE scan. Runs on every PR and push.
  # ---------------------------------------------------------------------------
  audit:
    name: pip-audit (CVE)
    runs-on: ubuntu-latest
    # Observed 11-23s. It resolves the dependency tree against the PyPI advisory
    # service, so the only realistic overrun is a stalled network call.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run pip-audit
        run: uv run pip-audit --strict

  # ---------------------------------------------------------------------------
  # The npm half of the same gate. Its absence is why eighteen vulnerable packages
  # (16 distinct advisories) accumulated unnoticed while pip-audit kept the Python
  # tree clean -- one of them, a prototype pollution in @tanstack/form-core, in the
  # shipped bundle, and three rated critical in tooling that runs in this workflow.
  #
  # Its own job rather than a step in `frontend`: an upstream disclosure turns this
  # red without a single line of our code changing, and that must not read as "the
  # SPA is broken". Same shape as pip-audit above, same reviewed-ignore convention
  # if a finding ever turns out to be unfixable.
  #
  # Both audit jobs also run nightly. On PR/push alone, a CVE disclosed during a
  # quiet week stays invisible until the next unrelated change -- which is the
  # failure mode that produced the backlog in the first place.
  # ---------------------------------------------------------------------------
  npm-audit:
    name: npm audit (CVE)
    runs-on: ubuntu-latest
    # Observed 5-11s, the cheapest job here: --package-lock-only means no install,
    # just one registry round trip. Five minutes is already two orders of headroom.
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --audit-level=info, spelled out: omitting the flag is NOT "no floor". npm
      # leaves the config null and npm-audit-report falls back to ``low``, so an
      # info-severity advisory prints in the log and the job exits 0. The backlog
      # this gate exists for included a browser-facing prototype-pollution hole
      # rated merely "moderate", so guessing a floor is exactly the wrong instinct.
      #
      # No --omit=dev either: devDependencies are where the backlog lived, and one
      # of them (@hey-api/openapi-ts) emits code INTO the shipped client.
      #
      # --package-lock-only, and deliberately no ``npm ci``: lockfileVersion 3
      # records the fully resolved tree including what ``overrides`` resolved to, so
      # the install buys no extra coverage -- it only adds a way for this job to go
      # red over registry flake or lockfile drift under a label that says "CVE".
      # Drift is the `frontend` job's business; it runs npm ci already.
      - name: Run npm audit
        run: npm audit --package-lock-only --audit-level=info

  # ---------------------------------------------------------------------------
  # SAST scan on every PR and push, so the security gate fires before merge
  # (not after). The heavier full rulesets run in the nightly workflow.
  # ---------------------------------------------------------------------------
  semgrep:
    name: semgrep (SAST, auto)
    runs-on: ubuntu-latest
    # Observed 24-31s. `--config auto` fetches its ruleset from the semgrep
    # registry, so the headroom is for a slow or retrying registry rather than
    # for the scan itself.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run semgrep
        # No --exclude-rule list: the CI-hardening advisories it used to mute
        # (dependabot/uv cooldowns + mutable action tags) are fixed at the source —
        # actions pinned to SHAs, cooldowns configured in dependabot.yml/pyproject.
        run: uv run semgrep --config auto --error .

  # ---------------------------------------------------------------------------
  # aislop — AI-slop quality gate, zero-tolerance (any error OR warning fails).
  # It is an npm tool, so the runner needs Node; the gate is a thin JSON-parsing
  # wrapper (tools/aislop_gate.py). Runs on every PR and push.
  # ---------------------------------------------------------------------------
  aislop:
    name: aislop (quality gate, zero-tolerance)
    runs-on: ubuntu-latest
    # Observed 22-35s. The gate npx-installs an npm package before it runs, so
    # the headroom covers a slow npm registry, not the analysis.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run aislop gate
        run: uv run python tools/aislop_gate.py

  # ---------------------------------------------------------------------------
  # gen-api drift — regenerate the typed frontend client from the live OpenAPI
  # schema and fail if it differs from what is committed. This is the hard
  # anti-drift gate: pydantic -> FastAPI OpenAPI -> hey-api client must stay
  # in sync. Pinned generator versions (frontend/package-lock.json + npm ci)
  # make the output reproducible across machines.
  # ---------------------------------------------------------------------------
  gen-api:
    name: gen-api (client drift)
    runs-on: ubuntu-latest
    # Observed 21-35s, but that is with a warm npm cache; this job runs `npm ci`
    # in frontend/ before regenerating, and a cold install is the slow case.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Regenerate the API client
        run: uv run python -m tools.gen_api

      - name: Fail on client drift
        run: git diff --exit-code frontend/src/shared/api frontend/openapi.json

  # ---------------------------------------------------------------------------
  # frontend — the React SPA's own gate set (per the FSD ADR): Steiger boundary
  # lint + ESLint + Prettier + tsc --strict + Vitest (80% floor), then a
  # production build. Independent of the Python jobs.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (lint/boundaries/tsc/vitest)
    runs-on: ubuntu-latest
    # Observed 71-102s — the second-slowest job here, and the one with the most
    # steps that can wedge (npm ci, Steiger, tsc, vitest, the production build).
    # Ten minutes is ~6x its worst run.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Gates (boundaries + eslint + prettier + tsc + vitest)
        run: npm run gates

      - name: Build
        run: npm run build
