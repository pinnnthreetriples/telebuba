name: MEX memory

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: MEX drift, freshness and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check memory adapter sync
        shell: bash
        run: |
          cmp -s .mex/AGENTS.md AGENTS.md
          cmp -s .mex/AGENTS.md CLAUDE.md
          cmp -s .mex/AGENTS.md .tool-configs/CLAUDE.md

      - name: Check routed memory budgets
        shell: bash
        run: |
          set -euo pipefail
          check_max() {
            local file="$1"
            local limit="$2"
            local bytes
            bytes=$(wc -c < "$file")
            if (( bytes > limit )); then
              echo "$file is $bytes bytes; limit is $limit"
              exit 1
            fi
          }
          check_max .mex/AGENTS.md 1500
          check_max .mex/ROUTER.md 2500
          for file in .mex/context/*.md; do check_max "$file" 5000; done
          for file in .mex/patterns/*.md; do check_max "$file" 3000; done

      - name: Check MEX memory
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mex-check.json"
          npx --yes mex-agent@0.7.1 check --json > "$report"
          node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(JSON.stringify(r, null, 2)); if ((r.issues ?? []).length) { console.error(`MEX reported ${r.issues.length} issue(s); warnings are blocking.`); process.exit(1); }' "$report"

      - name: MEX diagnostics
        if: always()
        run: npx --yes mex-agent@0.7.1 doctor
